<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><title>Donat Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f4f4;--card:#fff;--tx:#111;--mu:#666;--ac:#111;--ab:#fff;--bd:#ddd}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--card:#151515;--tx:#fff;--mu:#9a9a9a;--ac:#fff;--ab:#000;--bd:#2b2b2b}}
:root[data-theme=dark]{--bg:#0a0a0a;--card:#151515;--tx:#fff;--mu:#9a9a9a;--ac:#fff;--ab:#000;--bd:#2b2b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:17px;margin:0}h3{margin:4px 0 10px}main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{cursor:pointer;text-align:center;padding:8px}.game img,.hero{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.hero{max-width:150px;margin-bottom:8px}.game b{display:block;margin-top:6px;font-size:14px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:5px 0}
header select{width:auto;padding:6px;font-size:14px;margin:0}
button{background:var(--ac);color:var(--ab);border:0;border-radius:10px;padding:10px 13px;font-size:14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.gp{background:#000;color:#fff;border:1px solid #888;width:100%;padding:13px;font-weight:600;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:13px}.err{color:#dc2626;font-size:14px}.ok{color:#16a34a;font-size:14px}
.pk{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;cursor:pointer}.pk.sel{border:2px solid var(--ac)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--bg);border-radius:10px;padding:10px}.stat b{display:block;font-size:16px;margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.tabs button{flex:1;white-space:nowrap}
.top{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}td button{padding:5px 8px;font-size:12px;margin:1px}
a.b{display:block;text-align:center;text-decoration:none;background:#229ed9;color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:600}
.msg{max-width:80%;padding:8px 10px;border-radius:12px;margin:4px 0;background:var(--bg);word-break:break-word}.msg.me{margin-left:auto;background:var(--ac);color:var(--ab)}.msg div{font-size:10px;opacity:.6}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
#bar button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;color:var(--mu);border-radius:0;padding:8px 2px;font-size:10px}#bar button span{display:block;font-size:20px}#bar button.on{color:var(--tx);font-weight:700}
</style></head><body>

function login(){app.innerHTML=`<div class="card"><h3>${t("signin")}</h3><input id="e" type="email" placeholder="Gmail"><input id="p" type="password" placeholder="${t("newp").replace(/^.*$/,{uz:"Parol",en:"Password",ru:"Пароль"}[lang])}">${st.tmp.fok?`<p class="ok">${t("fgok")}</p>`:""}<p id="m" class="err">${st.tmp.bm?t("ban"):""}</p><button onclick="doLogin()" style="width:100%">${t("signin")}</button><p class="mu">${t("noacc")} <a href="#" onclick="go('reg');return false">${t("signup")}</a></p><p class="mu"><a href="#" onclick="st.tmp={step:1};go('forgot');return false">${t("fg")}</a></p></div>`;st.tmp.fok=false}
async function doLogin(){st.tmp.bm=false;const e=$("#e").value.trim().toLowerCase(),p=$("#p").value;
 if(await sha(e+"|"+p)===ADMIN_HASH){st.admin=true;st.user=null;go("admin");return}
 const u=users().find(x=>x.e===e);if(!u||u.h!==await sha(e+p)){$("#m").textContent=t("badl");return}
 if(!u.v){$("#m").textContent=t("unv");return}if(u.ban){$("#m").textContent=t("ban");return}st.user=e;go("home")}
function forgot(){const k=st.tmp.step||1;let b="";
 if(k===1)b=`<input id="e" type="email" placeholder="Gmail"><p id="m" class="err"></p><button onclick="fgSend()" style="width:100%">${t("sc")}</button>`;
 if(k===2)b=`<p class="mu">${st.tmp.fe} ${t("sent")}</p>${st.tmp.live?"":`<p class="mu">⚠️ ${t("demo")} <b>${st.tmp.fc}</b></p>`}<input id="c" inputmode="numeric" maxlength="6" placeholder="000000"><p id="m" class="err"></p><button onclick="fgCode()" style="width:100%">${t("ver")}</button>`;
 if(k===3)b=`<input id="n1" type="password" placeholder="${t("newp")}"><input id="n2" type="password" placeholder="${t("np2")}"><p id="m" class="err"></p><button onclick="fgSave()" style="width:100%">${t("save")}</button>`;
 app.innerHTML=`<div class="card"><h3>${t("fgt")}</h3>${b}<p class="mu"><a href="#" onclick="go('login');return false">${t("back")}</a></p></div>`}
async function fgSend(){const e=$("#e").value.trim().toLowerCase(),u=users().find(x=>x.e===e&&x.v);if(!u){$("#m").textContent=t("nouser");return}
 if(LIVE){$("#m").textContent="...";const r=await API("send-code",{email:e,purpose:"reset"}).catch(()=>({}));if(!r.token){$("#m").textContent=t("sendfail");return}st.tmp={step:2,fe:e,token:r.token,live:true};forgot();return}
 st.tmp={step:2,fe:e,fc:String(Math.floor(100000+Math.random()*900000))};forgot()}
async function fgCode(){const c=$("#c").value.trim();
 if(st.tmp.live){const r=await API("verify-code",{email:st.tmp.fe,code:c,token:st.tmp.token,purpose:"reset"}).catch(()=>({}));if(!r.ok){$("#m").textContent=t("badc");return}}
 else if(c!==st.tmp.fc){$("#m").textContent=t("badc");return}
 st.tmp.step=3;forgot()}
async function fgSave(){const a=$("#n1").value,b=$("#n2").value;if(a.length<6){$("#m").textContent=t("short");return}if(a!==b){$("#m").textContent=t("mism");return}
 const us=users(),u=us.find(x=>x.e===st.tmp.fe);u.h=await sha(u.e+a);S("users",us);st.tmp={fok:true};go("login")}
function reg(){app.innerHTML=`<div class="card"><h3>${t("signup")}</h3><input id="e" type="email" placeholder="Gmail (@gmail.com)"><input id="p" type="password" placeholder="${{uz:"Parol (kamida 6)",en:"Password (min 6)",ru:"Пароль (мин. 6)"}[lang]}"><p id="m" class="err"></p><button onclick="doReg()" style="width:100%">${t("sc")}</button></div>`}
async function doReg(){const e=$("#e").value.trim().toLowerCase(),p=$("#p").value;
 if(!/^[a-z0-9._+-]+@gmail\.com$/.test(e)){$("#m").textContent=t("gm");return}
 if(p.length<6){$("#m").textContent=t("short");return}
 if(users().some(x=>x.v&&x.e===e)){$("#m").textContent=t("taken");return}
 const h=await sha(e+p);
 if(LIVE){$("#m").textContent="...";const r=await API("send-code",{email:e,purpose:"reg"}).catch(()=>({}));if(!r.token){$("#m").textContent=t("sendfail");return}st.tmp={e,h,token:r.token,live:true};go("verify");return}
 const code=String(Math.floor(100000+Math.random()*900000));st.tmp={e,h,code};go("verify")}
function verify(){app.innerHTML=`<div class="card"><h3>${t("ec")}</h3><p class="mu">${st.tmp.e} ${t("sent")}</p>${st.tmp.live?"":`<p class="mu">⚠️ ${t("demo")} <b>${st.tmp.code}</b></p>`}<input id="c" inputmode="numeric" maxlength="6" placeholder="000000"><p id="m" class="err"></p><button onclick="doVerify()" style="width:100%">${t("ver")}</button></div>`}
async function doVerify(){const c=$("#c").value.trim();
 if(st.tmp.live){const r=await API("verify-code",{email:st.tmp.e,code:c,token:st.tmp.token,purpose:"reg"}).catch(()=>({}));if(!r.ok){$("#m").textContent=t("badc");return}}
 else if(c!==st.tmp.code){$("#m").textContent=t("badc");return}
 const u=users().filter(x=>x.e!==st.tmp.e);u.push({e:st.tmp.e,h:st.tmp.h,v:true,at:new Date().toLocaleString()});S("users",u);st.user=st.tmp.e;go("home")}

function admin(){if(!st.admin){go("login");return}const o=orders(),u=users(),a=st.at;
 const tabs=["m1","m2","m3","m4","m5","m6"].map(k=>`<button class="${a===k?'':'g'}" onclick="st.at='${k}';admin()">${t(k)}</button>`).join("");
 let b="";
 if(a==="m1")b=`<div class="card"><p class="mu">${t("un")}: ${u.length} · ${t("on")}: ${o.length} · ${t("dep")}: ${money(deps().reduce((s,x)=>s+x.sum,0))}</p></div>
 <div class="card"><h3>${t("bt")}</h3><input id="bs" type="number" inputmode="numeric" placeholder="${t("bsum")}"><p id="bm" class="ok"></p><button onclick="bonusAll()" style="width:100%">${t("give")}</button></div>
 <div class="card"><h3>${t("rt")}</h3><input id="ks" type="number" value="${kurs()}"><p id="km" class="ok"></p><button onclick="saveK()" style="width:100%">${t("save")}</button></div>`;
 if(a==="m2")b=`<div class="card"><h3>${t("pc")}</h3><input id="pn" placeholder="${t("pcn")}"><input id="ps" type="number" inputmode="numeric" placeholder="${t("bsum")}"><input id="pl" type="number" inputmode="numeric" placeholder="${t("lim")}"><p id="pm" class="err"></p><button onclick="mkPromo()" style="width:100%">${t("cr")}</button></div>
 <div class="card">${promos().map(p=>`<div class="top"><span><b>${esc(p.code)}</b> · ${money(p.sum)}<br><span class="mu">${p.used.length}/${p.max} ${t("used")}</span></span><button class="g" onclick="delP('${esc(p.code)}')">${t("del")}</button></div>`).join("")||`<p class="mu">${t("none")}</p>`}</div>`;
 if(a==="m3")b=`<div class="card"><p class="mu">🔒 ${t("pwn")}</p><div class="scroll"><table><tr><th>Gmail</th><th>${t("dep")}</th><th>${t("bal")}</th><th></th></tr>${u.map(x=>`<tr><td>${x.e}${x.ban?" 🚫":""}${x.mute>Date.now()?" 🔇 "+fmt(x.mute-Date.now()):""}</td><td>${money(dep(x.e))}</td><td>${money(bal(x.e))}</td><td><button class="g" onclick="uBal('${x.e}')">${t("bchg")}</button><button class="g" onclick="uDep('${x.e}')">${t("dp")}</button><button class="g" onclick="uMute('${x.e}')">${x.mute>Date.now()?t("um"):t("mt")}</button><button class="g" onclick="st.cu='${x.e}';st.at='m6';admin()">💬</button><button class="g" onclick="uPw('${x.e}')">${t("pwset")}</button><button class="g" onclick="uBan('${x.e}')">${x.ban?t("ub"):t("bn")}</button><button class="g" onclick="uDel('${x.e}')">${t("del")}</button></td></tr>`).join("")||`<tr><td>${t("none")}</td></tr>`}</table></div></div>`;
 if(a==="m6"){const m=L("msgs",[]),us=[...new Set([...m.map(x=>x.u),...(st.cu?[st.cu]:[])])],cu=st.cu;
 b=`<div class="card">${us.map(e=>`<div class="top" style="cursor:pointer" onclick="st.cu='${e}';admin()"><span>${cu===e?"▶ ":""}${e}</span><span class="mu">${m.filter(x=>x.u===e).length}</span></div>`).join("")||`<p class="mu">${t("nomsg")}</p>`}</div>`+(cu?`<div class="card"><h3>${cu}</h3><div style="max-height:45vh;overflow-y:auto">${m.filter(x=>x.u===cu).map(x=>`<div class="msg ${x.f==='a'?'me':''}">${esc(x.t)}<div>${x.at}</div></div>`).join("")||`<p class="mu">${t("nomsg")}</p>`}</div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="ar" placeholder="${t("reply")}" style="flex:1;margin:0"><button onclick="adminReply()">${t("send")}</button></div></div>`:"")}
 if(a==="m5")b=GAMES.map(g=>`<div class="card"><h3>${g.n}</h3>${plist(g).map(p=>`<div class="top"><span>${esc(p.l)}</span><span class="row"><input type="number" inputmode="numeric" step="1000" value="${p.s}" style="width:110px;margin:0" onchange="setPO('${p.k}',this.value)">${{uz:"so'm",en:"UZS",ru:"сум"}[lang]}${p.xi!==undefined?`<button class="g" onclick="delX(${p.xi})">${t("del")}</button>`:""}</span></div>`).join("")}</div>`).join("")+`<div class="card"><h3>${t("addp")}</h3><select id="xg">${GAMES.map(g=>`<option value="${g.id}">${g.n}</option>`).join("")}</select><input id="xl" placeholder="${t("pname")}"><input id="xu" type="number" inputmode="numeric" placeholder="${t("amt")}"><button onclick="addX()" style="width:100%">${t("cr")}</button></div>`;
 if(a==="m4")b=`<div class="card"><div class="scroll"><table><tr><th>${t("time")}</th><th>Gmail</th><th>${t("game")}</th><th>ID</th><th>${t("pack")}</th><th>${t("sum")}</th><th>${t("st")}</th><th></th></tr>${o.slice().reverse().map(x=>`<tr><td>${x.at}</td><td>${x.user}</td><td>${esc(x.game)}</td><td>${esc(x.pid)}</td><td>${esc(x.item)}</td><td>${money(x.sum)}</td><td>${t(x.status)}</td><td>${x.status!=="s2"?`<button onclick="fin(${x.id})">${t("fin")}</button>`:""}</td></tr>`).join("")||`<tr><td>${t("none")}</td></tr>`}</table></div></div>`;
 app.innerHTML=`<div class="card"><h3>${t("adm")}</h3><div class="tabs">${tabs}</div></div>`+b}
function setPO(k,v){const p=L("po",{}),n=parseInt(v);if(n>0){p[k]=n;S("po",p)}}
function addX(){const l=$("#xl").value.trim(),u=parseInt($("#xu").value);if(!l||!(u>0))return;const e=L("ex",[]);e.push({g:$("#xg").value,l:l.slice(0,50),sum:u});S("ex",e);admin()}
function delX(i){const e=L("ex",[]);e.splice(i,1);S("ex",e);admin()}
function bonusAll(){const s=parseInt($("#bs").value);if(!s)return;const b=bons(),n=Date.now();users().filter(x=>x.v&&!x.ban).forEach(x=>b.push({u:x.e,sum:s,ts:n,note:"bonus"}));S("bons",b);$("#bm").textContent=t("bdone")+money(s)}
function saveK(){const k=parseInt($("#ks").value);if(k>0){S("kurs",k);$("#km").textContent=t("ok")}}
function mkPromo(){const c=$("#pn").value.trim().toUpperCase(),s=parseInt($("#ps").value),l=parseInt($("#pl").value),p=promos();
 if(!/^[A-Z0-9_-]{3,20}$/.test(c)||!s||!l)return;if(p.some(x=>x.code===c)){$("#pm").textContent=t("exists");return}
 p.push({code:c,sum:s,max:l,used:[]});S("promos",p);admin()}
function delP(c){S("promos",promos().filter(x=>x.code!==c));admin()}
function fin(id){const o=orders();o.find(x=>x.id==id).status="s2";S("orders",o);admin()}
function uBal(e){const v=parseInt(prompt(t("balq")));if(!v)return;const b=bons();b.push({u:e,sum:v,ts:Date.now(),note:"admin"});S("bons",b);admin()}
async function uPw(e){const p=prompt(t("newpa"));if(!p||p.length<6)return;const us=users();us.find(x=>x.e===e).h=await sha(e+p);S("users",us);admin()}
function uDep(e){const v=parseInt(prompt(t("dpq")));if(!(v>0))return;const d=deps();d.push({u:e,sum:v,ts:Date.now(),note:"admin"});S("deps",d);admin()}
function uMute(e){const us=users(),u=us.find(x=>x.e===e);if(u.mute>Date.now()){u.mute=0}else{const v=parseInt(prompt(t("muteq")));if(!(v>0))return;u.mute=Date.now()+v*60000}S("users",us);admin()}
function adminReply(){const v=$("#ar").value.trim().slice(0,500);if(!v||!st.cu)return;const m=L("msgs",[]);m.push({u:st.cu,f:"a",t:v,at:new Date().toLocaleString()});S("msgs",m);admin()}
function uBan(e){const us=users(),u=us.find(x=>x.e===e);u.ban=!u.ban;S("users",us);admin()}
function uDel(e){if(!confirm(t("delq")))return;S("users",users().filter(x=>x.e!==e));admin()}
applyTheme();render();
</script></body></html>
